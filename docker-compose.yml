services:

  postgres:
    image: postgres:16-alpine
    container_name: bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Bank"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bank-network

  kafka:
    image: apache/kafka:3.9.1
    container_name: bank-kafka
    hostname: bank-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://bank-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@bank-kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - bank-network

  user-service:
    build:
      context: ./user-service
    container_name: bank-user-service
    restart: unless-stopped
    ports:
      - "10001:10001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bank-postgres:5432/Bank
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: bank-kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - bank-network

  account-service:
    build:
      context: ./account-service
    container_name: bank-account-service
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bank-postgres:5432/Bank
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: bank-kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - bank-network

  transaction-service:
    build:
      context: ./transaction-service
    container_name: bank-transaction-service
    restart: unless-stopped
    ports:
      - "10002:10002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bank-postgres:5432/Bank
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: bank-kafka:9092
      SERVICES_ACCOUNT_SERVICE_BASE_URL: http://bank-account-service:10000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
    networks:
      - bank-network

  logging-service:
    build:
      context: ./logging-service
    container_name: bank-logging-service
    restart: unless-stopped
    ports:
      - "10003:10003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bank-postgres:5432/Bank
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: bank-kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - bank-network

  bff-service:
    build:
      context: ./bff-service
    container_name: bank-bff-service
    restart: unless-stopped
    ports:
      - "10005:10005"
    environment:
      SERVICES_USER_SERVICE_BASE_URL: http://bank-user-service:10001
      SERVICES_ACCOUNT_SERVICE_BASE_URL: http://bank-account-service:10000
      SERVICES_TRANSACTION_SERVICE_BASE_URL: http://bank-transaction-service:10002
    depends_on:
      user-service:
        condition: service_started
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge

volumes:
  postgres-data:
  kafka-data: