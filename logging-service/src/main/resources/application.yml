server:
  port: 10003

  kafka:
    bootstrap-servers: bank-kafka:9092
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/Bank
    username: postgres
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: sk-placeholder-not-real

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: logging-group
      auto-offset-reset: earliest

      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.example.logging_service.dto.LogMessage